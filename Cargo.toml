[workspace]
members = ["crates/core", "crates/player"]
# Building at the root only builds the main player, so future tools do not
# slow down everyday work.
default-members = ["crates/player"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/PCXzaKittiphoom/DontreeCrab"
homepage = "https://github.com/PCXzaKittiphoom/DontreeCrab"
description = "DontreeCrab - MIDI karaoke player for KAR, NCN and KMID files"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.37.0"
encoding_rs = "0.8"
flate2 = "1"
hound = "3.5.1"
midly = "0.5"
rfd = "0.17.2"
roxmltree = "0.21"
rustysynth = "1.3.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
