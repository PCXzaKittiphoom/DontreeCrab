name: Bug report
description: Report a crash, playback problem or incorrect display
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach copyrighted karaoke songs, lyrics, SoundFonts, or
        screenshots containing commercial lyrics. A synthetic MIDI file or a
        short description is enough.
  - type: input
    id: version
    attributes:
      label: DontreeCrab version / commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and audio device
      placeholder: Windows 11, default output, 44.1 kHz
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove personal data and copyrighted lyrics before uploading.
