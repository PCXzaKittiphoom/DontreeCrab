[package]
name = "dontreecrab"
version = "0.1.0"
edition = "2024"
description = "DontreeCrab - MIDI karaoke player for KAR, NCN and KMID files"
license = "MIT"

[lib]
name = "karaoke_player"
path = "src/lib.rs"

[[bin]]
name = "DontreeCrab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.37.0"
encoding_rs = "0.8"
flate2 = "1"
hound = "3.5.1"
midly = "0.5"
rfd = "0.17.2"
roxmltree = "0.21"
rustysynth = "1.3.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_SystemInformation"] }
winreg = "0.56.0"
